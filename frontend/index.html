<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sathi — voice-first post-hospital recovery companion." />
    <meta name="theme-color" content="#7C3AED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b1e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sathi — Recovery Companion</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("@sathi_theme") || localStorage.getItem("theme");
          var isDark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
